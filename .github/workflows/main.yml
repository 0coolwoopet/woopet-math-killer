name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win64

          - name: macOS
            os: macos-latest
            target: MacOS

          - name: iOS
            os: macos-latest
            target: iOS

          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Combine platform builds
        id: build
        uses: geode-sdk/build-geode-mod/combine@main

      - name: Upload combined mod
        uses: actions/upload-artifact@v4
        with:
          name: Build-Output
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: package
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # download-artifact unzips the artifact bundle automatically.
      # The .geode file inside is itself a zip and must stay as-is to be installable.
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: Build-Output
          path: release-files

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r '.version' mod.json)
          TAG="${VERSION}-build.${{ github.run_number }}"
          ls -R release-files
          gh release create "$TAG" release-files/*.geode \
            --title "$TAG" \
            --generate-notes \
            --target "${{ github.sha }}"
