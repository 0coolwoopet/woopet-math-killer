name: Build Multi-Platform Geode Mod

on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest
        - name: macOS
          os: macos-latest
        - name: Android
          os: ubuntu-latest
          target: Android64

    name: Build ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build Mod
      uses: geode-sdk/build-geode-mod@main
      with:
        combine: true
        target: ${{ matrix.config.target }}

  # The separate job to stitch all the platform builds together
  combine:
    name: Package builds
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Combine Artifacts
      uses: geode-sdk/build-geode-mod/combine@main
      id: build

    - name: Upload Final Mod
      uses: actions/upload-artifact@v4
      with:
        name: final-geode-mod
        path: ${{ steps.build.outputs.build-output }}
